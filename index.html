<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trescon Global - Executive Letterhead Studio</title>
  <meta name="description" content="Official Trescon Global executive letterhead studio. Directly compose letters on the A4 canvas and export as high-fidelity PDF.">
  
  <!-- Google Fonts: Anek Devanagari & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Quill.js Rich Text Editor CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  
  <link rel="stylesheet" href="letterhead.css?v=45.0">
</head>
<body class="role-user"> <!-- Default role is standard user. JS checks URL params to enable role-admin -->

  <div class="studio-app-container" style="display: flex; flex-direction: column; height: 100vh; overflow: hidden;">

    <!-- TOP NAVIGATION BAR (Visible to both roles, hosts branding, office selector, editing tools and actions) -->
    <header class="studio-top-navbar no-print" style="height: 56px; min-height: 56px; background-color: #070d14; border-bottom: 1px solid #1e2936; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-sizing: border-box; z-index: 100;">
      
      <!-- Brand & Office Selector -->
      <div class="navbar-brand" style="display: flex; align-items: center; gap: 14px;">
        <img src="brand_assets/trescon-logo-white-2025.png" alt="Trescon Logo" style="height: 22px; width: auto; flex-shrink: 0;">
        <div style="width: 1px; height: 18px; background: #2d3748; flex-shrink: 0;"></div>
        
        <!-- Office Selector (Available to all writers) -->
        <select id="office-preset" class="form-control" onchange="updateFooter()" style="background: #16202c; color: #ffffff; border: 1px solid #2d3748; padding: 6px 10px; font-size: 0.78rem; font-weight: 600; border-radius: 6px; outline: none; cursor: pointer; transition: border-color 0.2s;">
          <option value="bangalore" selected>Bangalore (HQ) — India</option>
          <option value="manipal">Manipal — India</option>
          <option value="mangalore">Mangalore — India</option>
          <option value="dubai">Dubai (DIFC) — UAE</option>
        </select>
      </div>
      
      <!-- Quill Top Toolbar Container -->
      <div id="editor-top-toolbar" style="flex: 1; max-width: 480px; display: flex; justify-content: center; margin: 0 10px;"></div>
      
      <!-- Actions Box -->
      <div class="navbar-actions" style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
        <!-- Preview Mode Toggle (Eye Icon) -->
        <button type="button" id="btn-preview-mode" onclick="togglePreviewMode()" style="padding: 8px 14px; font-size: 0.8rem; font-weight: 600; background-color: #16202c; color: #cbd5e1; border: 1px solid #2d3748; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background-color 0.2s;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="preview-btn-text">Preview</span>
        </button>

        <button type="button" id="btn-export-pdf" onclick="exportToPdf()" style="padding: 8px 16px; font-size: 0.8rem; font-weight: 700; background-color: #007876; color: #ffffff; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background-color 0.2s; box-shadow: 0 2px 4px rgba(0, 120, 118, 0.25);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Export PDF
        </button>
        
        <button type="button" id="btn-print-letterhead" onclick="printDocument()" style="padding: 8px 14px; font-size: 0.8rem; font-weight: 600; background-color: #16202c; color: #cbd5e1; border: 1px solid #2d3748; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background-color 0.2s;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print
        </button>

        <!-- Admin Toggle Cog (Only displayed for Admin role) -->
        <button type="button" id="btn-admin-toggle" onclick="toggleAdminSidebar()" style="background: none; border: none; color: #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 4px; transition: color 0.2s, background-color 0.2s;" title="Admin Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- MAIN TWO-PANEL STUDIO LAYOUT (FULL VIEWPORT HEIGHT MINUS NAV) -->
    <div class="studio-main-layout" style="height: calc(100vh - 56px); margin-top: 0; box-sizing: border-box; display: flex; overflow: hidden; width: 100%;">
      
      <!-- COLLAPSIBLE ADMIN PANEL SIDEBAR (Visible only to Admin role) -->
      <aside id="admin-sidebar" class="sidebar-form no-print" style="width: 300px; min-width: 300px; background-color: #070d14; border-right: 1px solid #1e2936; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-left: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #1e2936;">
          <h2 style="font-size: 0.88rem; font-weight: 700; color: #ffffff; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">Admin Dashboard</h2>
          <span style="font-size: 0.7rem; font-weight: 700; color: #00a5a3; background: rgba(0,165,163,0.1); padding: 2px 6px; border-radius: 4px;">ACTIVE</span>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <!-- 1. Page Margins Preset -->
          <div class="form-group">
            <label for="margins-preset" style="font-size: 0.78rem; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; display: block;">Page Margins (A4)</label>
            <select id="margins-preset" class="form-control" onchange="updateMargins()" style="background: #16202c; color: #ffffff; border: 1px solid #2d3748; padding: 8px 10px; font-size: 0.8rem; border-radius: 6px; width: 100%; outline: none; box-sizing: border-box;">
              <option value="normal" selected>Normal (Top 28mm, Left/Right 15mm)</option>
              <option value="compact">Compact (Top 20mm, Left/Right 10mm)</option>
              <option value="wide">Wide (Top 35mm, Left/Right 20mm)</option>
            </select>
          </div>

          <!-- 2. Watermark Switch -->
          <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px;">
            <label for="watermark-toggle" style="font-size: 0.78rem; font-weight: 600; color: #cbd5e1; cursor: pointer; user-select: none;">Document Watermark</label>
            <input type="checkbox" id="watermark-toggle" checked onchange="toggleWatermark()" style="width: 16px; height: 16px; accent-color: #00a5a3; cursor: pointer;">
          </div>

          <!-- 3. Signature Blocks Injector -->
          <div class="form-group" style="margin-top: 8px; border-top: 1px solid #1e2936; padding-top: 16px;">
            <label style="font-size: 0.78rem; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; display: block;">Inject Executive Signature Presets</label>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <button type="button" onclick="injectSignature('chairman')" style="width: 100%; padding: 8px; font-size: 0.75rem; font-weight: 600; background-color: #16202c; color: #cbd5e1; border: 1px solid #2d3748; border-radius: 4px; cursor: pointer; text-align: left; transition: background-color 0.2s;">
                ✍️ Chairman (M. Saleem)
              </button>
              <button type="button" onclick="injectSignature('ceo')" style="width: 100%; padding: 8px; font-size: 0.75rem; font-weight: 600; background-color: #16202c; color: #cbd5e1; border: 1px solid #2d3748; border-radius: 4px; cursor: pointer; text-align: left; transition: background-color 0.2s;">
                ✍️ CEO Presets
              </button>
            </div>
          </div>
        </div>
      </aside>

      <!-- RIGHT DISPLAY AREA: WORKSPACE WRAPPER -->
      <main class="preview-area" style="flex: 1; background-color: #070a0f; padding: 32px 16px 120px 16px !important; overflow-y: auto; height: 100%; display: block; box-sizing: border-box !important;">
        
        <!-- 1. COMPOSE MODE WORKSPACE (Visible on load) -->
        <div id="compose-workspace" style="display: block; width: 100%; max-width: 820px; margin: 0 auto;">
          <div id="composer-card" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); min-height: 500px; padding: 40px; box-sizing: border-box;">
            <!-- Quill Editor for Drafting (Looks like a clean writing sheet, no letterhead margins/logos/footers) -->
            <div id="quill-editor-compose" style="min-height: 420px; border: none !important;"></div>
          </div>
        </div>

        <!-- 2. PREVIEW MODE WORKSPACE (Hidden on load) -->
        <div id="preview-workspace" style="display: none; width: 100%;">
          <div class="paper-container" id="sheets-wrapper" style="display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto; padding-bottom: 60px; width: 100%; height: auto !important; min-height: 100% !important; max-height: none !important; box-sizing: border-box !important;">
            <!-- Dynamically populated by letterhead.js pagination engine -->
          </div>
        </div>

      </main>

    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="letterhead.js?v=45.0"></script>
</body>
</html>
